name: Sync Drupal Core Tags
on:
  schedule:
    - cron: "0 0 * * *" # run daily at midnight UTC
  workflow_dispatch: # allow manual trigger
jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed for tag operations
      - name: Fetch drupal/core tags
        run: |
          git clone --quiet --bare https://github.com/drupal/core.git drupal-core.git
          cd drupal-core.git
          git tag > /tmp/drupal-tags.txt
      - name: Compare tags
        id: compare
        run: |
          MAJOR_VERSIONS=(10 11)
          NEW_TAGS=""
          for MAJOR in "${MAJOR_VERSIONS[@]}"; do
            grep -E "^${MAJOR}\.[0-9]+\.[0-9]+$" /tmp/drupal-tags.txt | sort -V > "/tmp/drupal-tags-${MAJOR}.txt"
            LATEST_DRUPAL_TAG=$(tail -n 1 "/tmp/drupal-tags-${MAJOR}.txt")
            if [ "$LATEST_DRUPAL_TAG" != "" ] && ! git show-ref --verify --quiet "refs/tags/$LATEST_DRUPAL_TAG"; then
              NEW_TAGS="$NEW_TAGS $LATEST_DRUPAL_TAG"
            fi
          done
          echo "new_tags=${NEW_TAGS# }" >> "$GITHUB_OUTPUT"  # trim leading space
      - name: Create new tags in this repo
        if: steps.compare.outputs.new_tags != ''
        run: |
          for TAG in ${{ steps.compare.outputs.new_tags }}; do
            echo "Creating new tag: $TAG"
            git tag $TAG
            git push origin $TAG
          done
